name: Tests and editable demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: python3 scripts/inspect-pptx.py build/demo/research-slides.pptx --expected-slides 5 --out build/demo/inspection.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-slide-demo
          path: build/demo/
